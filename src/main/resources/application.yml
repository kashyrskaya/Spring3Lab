server:
  port: 8080

spring:
  profiles:
    active: "jdbcclient"
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:file:./data/potiondb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: sa
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      idle-timeout: 600000
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Custom properties for Potion business logic
potion:
  store:
    name: "Nastya's Magic Shop"
    max-potions: 5
    open-days: Monday,Tuesday,Wednesday
  brewing:
    base-multiplier: 2
    active-profile: "development"

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always

info:
  app:
    name: "Potion brewing API"
    description: "Spring Boot REST API for managing magical potions and alchemists."
    version: "2.0.0"
